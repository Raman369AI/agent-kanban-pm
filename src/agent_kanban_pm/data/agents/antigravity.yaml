name: antigravity
display_name: "Antigravity CLI (Google)"
version: "1.4"

# Google's replacement for the retired Gemini CLI, which this project no
# longer ships an adapter for. Flags below are taken from
# `agy --help` (v1.0.1): the CLI has no --model or --mcp flag, so those stay
# unset rather than being guessed.
invoke:
  command: agy
  info_flag: "--version"

capabilities: [code, analysis, summarization, debugging, testing, planning]

models:
  - id: antigravity-default
    context_window: 1000000

protocol: stdio

auth:
  type: none
roles: [worker, manager]
modes: [supervised, auto, headless]

reporting:
  heartbeat_interval: 30

chat_designer:
  prompt_flag: "-p"
  stdin: false
  output_format: "stdout"
  timeout_seconds: 300
  # `agy --print` writes nothing when stdout is a pipe (it hangs, then exits 0
  # with zero bytes). The chat designer must therefore run it on a PTY.
  requires_tty: true

# Role sessions run interactively; only the autonomy flags carry over.
role_command:
  args: []
  auto_args: ["--dangerously-skip-permissions"]

task_command:
  # --prompt-interactive, not --print. Supervised runs depend on the CLI
  # rendering its approval prompt in the tmux pane: the session streamer
  # detects it, files an AgentApproval for a human, and sends the keystroke
  # back. --print is headless, so it renders no prompt and every tool needing
  # permission is auto-denied — the run ends with "no output produced".
  # The prompt is attached with `=` because these flags take it as their value
  # and would otherwise consume the following argument.
  args: ["--add-dir", "{workspace}", "--prompt-interactive={prompt}"]
  auto_args: ["--dangerously-skip-permissions"]

owns: ['*']
review_only: false
