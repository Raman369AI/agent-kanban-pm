name: Python package

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install package (editable, with dev extras)
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e ".[dev]"

    - name: Lint with flake8
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Test with pytest
      run: pytest -v --timeout=60 --timeout-method=thread

  test-macos:
    name: Test (macOS, Python 3.12)
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install package
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e ".[dev]"

    - name: Run fatal lint checks
      run: flake8 src tests --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Run tests
      run: pytest -q --timeout=60 --timeout-method=thread

  locked:
    name: Locked install (uv.lock)
    runs-on: ubuntu-latest

    # The matrix job above resolves dependencies fresh, which catches upstream
    # breakage early but means CI tests a different set than a locked install
    # gives a user. This job pins to uv.lock so the shipped combination is
    # exercised too; if the two disagree, the lockfile needs refreshing.
    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        # Pinned: uv.lock carries a format revision, and a newer uv than the
        # one that wrote it fails `uv lock --check` even when the resolution is
        # unchanged. Bump this together with a regenerated lockfile.
        version: "0.12.7"
        enable-cache: true

    - name: Verify the lockfile is current
      run: uv lock --check

    - name: Test against the locked dependency set
      run: uv run --locked --extra dev python -m pytest -q --timeout=60 --timeout-method=thread

  build-and-smoke:
    name: Build wheel + smoke test
    needs: [test, test-macos, locked]
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install build tooling
      run: |
        python -m pip install --upgrade pip
        python -m pip install build twine

    - name: Build sdist and wheel
      run: python -m build

    - name: Check distribution metadata
      run: twine check dist/*

    - name: Install built wheel in clean venv
      run: |
        python -m venv /tmp/wheel-venv
        /tmp/wheel-venv/bin/pip install --upgrade pip
        /tmp/wheel-venv/bin/pip install dist/*.whl

    - name: Smoke test - kanban --help
      run: /tmp/wheel-venv/bin/kanban --help

    - name: Smoke test - server boots, serves UI, and enforces auth
      env:
        DATABASE_URL: sqlite+aiosqlite:////tmp/kanban-smoke.db
      run: |
        /tmp/wheel-venv/bin/python - <<'PY'
        from fastapi.testclient import TestClient
        from agent_kanban_pm.app import app

        def check(response, expected, label):
            assert response.status_code == expected, (
                f"{label}: expected {expected}, got {response.status_code}\n{response.text[:500]}"
            )

        # TrustedHostMiddleware only accepts loopback hosts, so the smoke test
        # must speak to the server the way a browser on localhost does.
        with TestClient(app, base_url="http://localhost:8000") as client:
            # Unauthenticated: public endpoints answer, everything else is gated.
            check(client.get("/health"), 200, "GET /health")
            check(client.get("/static/css/style.css"), 200, "GET /static/css/style.css")
            check(client.get("/docs"), 401, "GET /docs (unauthenticated)")
            check(client.get("/tasks"), 401, "GET /tasks (unauthenticated)")

            # Loading a page hands the browser its auth cookie.
            page = client.get("/")
            check(page, 200, "GET /")
            set_cookie = page.headers.get("set-cookie", "").lower()
            assert "kanban-token=" in set_cookie, set_cookie
            assert "httponly" in set_cookie, set_cookie
            assert "samesite=strict" in set_cookie, set_cookie

            # With the cookie the client is authenticated for the rest.
            check(client.get("/docs"), 200, "GET /docs (authenticated)")
            check(client.get("/tasks"), 200, "GET /tasks (authenticated)")

        # A foreign Host header is rejected before routing (DNS-rebinding defense).
        with TestClient(app, base_url="http://evil.example.com") as client:
            check(client.get("/health"), 400, "GET /health with foreign Host")
        print("server boot smoke OK")
        PY
      working-directory: /tmp
