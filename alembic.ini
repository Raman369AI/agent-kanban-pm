# Developer entry point for authoring migrations, for example:
#   uv run alembic revision --autogenerate -m "add foo column"
# The application itself never reads this file: db.init_db() builds its own
# config (agent_kanban_pm.db_migrations.make_config). The database URL comes
# from DATABASE_URL, or the instance database, exactly as the server resolves it.
[alembic]
script_location = src/agent_kanban_pm/db_migrations
