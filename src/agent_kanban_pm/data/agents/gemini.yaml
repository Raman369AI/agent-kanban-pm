name: gemini
display_name: "Gemini CLI (retired)"
version: "1.1"

# Google retired Gemini CLI for consumer accounts on 2026-06-18 and replaced it
# with Antigravity CLI. Access continues only for Gemini Code Assist
# Standard/Enterprise licences and paid API keys, so this adapter is kept
# loadable for those users — but hidden from discovery and warned about on use.
deprecated: true
replaced_by: antigravity
deprecation_note: >-
  Gemini CLI was retired for consumer accounts on 2026-06-18. It still works
  with a Gemini Code Assist Standard/Enterprise licence or a paid API key.
  Otherwise switch to Antigravity CLI: kanban roles assign <role> antigravity

invoke:
  command: gemini
  mcp_flag: "--mcp"
  info_flag: "--version"
  model_flag: "--model"

capabilities: [code, analysis, summarization, debugging, testing]

models:
  - id: gemini-2.5-pro
    context_window: 1000000

protocol: mcp

auth:
  type: none
roles: [worker]
modes: [supervised, auto, headless]

reporting:
  heartbeat_interval: 30

chat_designer:
  prompt_flag: "-p"
  stdin: false
  output_format: "stdout"
  timeout_seconds: 180

task_command:
  args: ["-i", "{prompt}"]
  auto_args: ["--approval-mode", "yolo"]

owns: ['ui/', 'components/', 'templates/', 'static/']
review_only: false
