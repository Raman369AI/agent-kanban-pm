name: claude
display_name: "Claude (Anthropic)"
version: "1.2"

invoke:
  command: claude
  mcp_flag: "--mcp-config"
  info_flag: "--version"
  model_flag: "--model"

capabilities: [code, review, planning, testing, writing]

models:
  - id: claude-sonnet-4-6
    context_window: 200000

protocol: mcp

auth:
  type: none
roles: [orchestrator, worker, architecture, diff_review]
modes: [supervised, auto, headless]

reporting:
  heartbeat_interval: 30

chat_designer:
  prompt_flag: "-p"
  stdin: false
  output_format: "stdout"
  timeout_seconds: 180

# Role sessions run interactively; only the autonomy flags carry over.
role_command:
  args: []
  auto_args: ["--permission-mode", "bypassPermissions"]

task_command:
  # --add-dir is variadic (<directories...>), so it keeps consuming arguments
  # until the next flag: with ["--print", "--add-dir", "{workspace}",
  # "{prompt}"] it swallowed the prompt as a second directory and claude ran
  # with no instruction. --print terminates it, and the prompt stays positional.
  args: ["--add-dir", "{workspace}", "--print", "{prompt}"]
  auto_args: ["--permission-mode", "bypassPermissions"]

# Handoff profile (P1-2)
owns: ['src/', 'tests/', 'lib/']
review_only: false
