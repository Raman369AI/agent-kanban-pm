name: Published package smoke

on:
  schedule:
    - cron: "17 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install latest published version
      run: |
        python -m pip install --upgrade pip
        # --pre is not scoped to the named package: it lets pip take
        # development releases of every dependency too, and once resolved
        # httpx to 1.0.dev6, whose API no longer exposes AsyncClient. Resolve
        # our own pre-release explicitly, then install that exact pin so the
        # dependencies still come from stable releases.
        version="$(python -m pip index versions --pre agent-kanban-pm \
          | sed -n 's/^agent-kanban-pm (\(.*\))$/\1/p')"
        if [ -z "$version" ]; then
          echo "could not determine a published version of agent-kanban-pm" >&2
          exit 1
        fi
        echo "installing agent-kanban-pm==$version"
        python -m pip install "agent-kanban-pm==$version"

    - name: Verify CLI and server boot
      env:
        DATABASE_URL: sqlite+aiosqlite:////tmp/kanban-published-smoke.db
        HOME: /tmp/kanban-published-smoke-home
      run: |
        kanban --help
        python - <<'PYCODE'
        from fastapi.testclient import TestClient
        from agent_kanban_pm.app import app

        with TestClient(app, base_url="http://localhost:8000") as client:
            assert client.get("/health").status_code == 200
            page = client.get("/")
            assert page.status_code == 200
            assert "kanban-token=" in page.headers.get("set-cookie", "").lower()
        print("published package server smoke OK")
        PYCODE
