name: claude
display_name: "Claude (Anthropic)"
version: "1.4"

invoke:
  command: claude
  mcp_flag: "--mcp-config"
  info_flag: "--version"
  model_flag: "--model"

capabilities: [code, review, planning, testing, writing]

models:
  - id: default

protocol: mcp

auth:
  type: none
roles: [orchestrator, worker, architecture, diff_review]
modes: [supervised, auto, headless]

reporting:
  heartbeat_interval: 30

chat_designer:
  prompt_flag: "-p"
  stdin: false
  output_format: "stdout"
  timeout_seconds: 180

# Role sessions run interactively; only the autonomy flags carry over.
role_command:
  args: []
  auto_args: ["--permission-mode", "bypassPermissions"]

task_command:
  # No --print: supervised runs need the CLI to render its approval prompt in
  # the tmux pane so session_streamer can capture it: headless mode prompts
  # for nothing and every permission-requiring tool is auto-denied.
  #
  # The prompt therefore leads. --add-dir is variadic (<directories...>) and
  # consumes arguments until the next flag, so with it ahead of the prompt the
  # prompt is taken as a second directory and claude reports "Input must be
  # provided either through stdin or as a prompt argument". Trailing it keeps
  # the binding unambiguous, and auto_args append after it as their own flag.
  args: ["{prompt}", "--add-dir", "{workspace}"]
  auto_args: ["--permission-mode", "bypassPermissions"]

# Handoff profile (P1-2)
owns: ['src/', 'tests/', 'lib/']
review_only: false
