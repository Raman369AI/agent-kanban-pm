name: opencode
display_name: "OpenCode"
version: "1.3"

# Flags verified against `opencode --help` / `opencode run --help` (v1.18.22).
invoke:
  command: opencode
  info_flag: "--version"
  model_flag: "--model"

capabilities: [code, debugging, fullstack, testing]

models:
  - id: opencode-default
    context_window: 128000

protocol: stdio

auth:
  type: none
roles: [worker, test]
modes: [supervised, auto, headless]

reporting:
  heartbeat_interval: 30

chat_designer:
  # `opencode run <message>` is the non-interactive form — a subcommand, not a
  # flag — so it is passed as an extra arg and the prompt is appended after it.
  prompt_flag: ""
  extra_args: ["run"]
  stdin: false
  output_format: "stdout"
  timeout_seconds: 300

# A persistent role has no message to give `run`, which refuses to start
# without one, so role sessions launch the interactive TUI instead.
role_command:
  args: []
  auto_args: []

task_command:
  # `opencode run` is headless, so it renders no approval prompt for the
  # session streamer to capture and supervised tools are auto-denied. The
  # top-level --prompt seeds the interactive TUI instead, which does prompt.
  # --dir is not a top-level flag and is unnecessary here: the task's tmux
  # session is already created with the worktree as its working directory.
  args: ["--prompt", "{prompt}"]
  auto_args: ["--auto"]

owns: []
review_only: false
