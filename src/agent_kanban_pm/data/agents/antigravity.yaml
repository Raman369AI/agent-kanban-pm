name: antigravity
display_name: "Antigravity CLI (Google)"
version: "1.3"

# Google's replacement for the retired Gemini CLI, which this project no
# longer ships an adapter for. Flags below are taken from
# `agy --help` (v1.0.1): the CLI has no --model or --mcp flag, so those stay
# unset rather than being guessed.
invoke:
  command: agy
  info_flag: "--version"

capabilities: [code, analysis, summarization, debugging, testing, planning]

models:
  - id: antigravity-default
    context_window: 1000000

protocol: stdio

auth:
  type: none
roles: [worker, manager]
modes: [supervised, auto, headless]

reporting:
  heartbeat_interval: 30

chat_designer:
  prompt_flag: "-p"
  stdin: false
  output_format: "stdout"
  timeout_seconds: 300
  # `agy --print` writes nothing when stdout is a pipe (it hangs, then exits 0
  # with zero bytes). The chat designer must therefore run it on a PTY.
  requires_tty: true

# Role sessions run interactively; only the autonomy flags carry over.
role_command:
  args: []
  auto_args: ["--dangerously-skip-permissions"]

task_command:
  # --print takes the prompt as its value (--prompt is an alias for it), so it
  # must not be followed by another flag: `--print --add-dir <dir> <prompt>`
  # makes agy read "--add-dir" as the prompt and silently drop the real one.
  # The prompt is attached with `=` and --add-dir moved ahead of it.
  args: ["--add-dir", "{workspace}", "--print={prompt}"]
  auto_args: ["--dangerously-skip-permissions"]

owns: ['*']
review_only: false
