name: antigravity
display_name: "Antigravity (AI Assistant)"
version: "1.0"

invoke:
  command: agy
  mcp_flag: "--mcp"
  info_flag: "--version"
  model_flag: "--model"

capabilities: [code, analysis, summarization, debugging, testing, planning]

models:
  - id: antigravity-v1
    context_window: 1000000

protocol: mcp

auth:
  type: none
roles: [worker, manager]
modes: [supervised, auto, headless]

reporting:
  heartbeat_interval: 30

chat_designer:
  prompt_flag: "-i"
  stdin: false
  output_format: "stdout"
  timeout_seconds: 180

task_command:
  args: ["-i", "{prompt}"]
  auto_args: ["--full-auto"]

owns: ['*']
review_only: false
