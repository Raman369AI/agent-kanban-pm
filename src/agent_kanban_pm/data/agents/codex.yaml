name: codex
display_name: "Codex (OpenAI)"
version: "1.1"

# `codex --mcp` is rejected: `mcp` is a subcommand, and MCP servers are
# registered with `codex mcp` / ~/.codex/config.toml rather than a launch flag.
invoke:
  command: codex
  mcp_flag: ""
  info_flag: "--version"
  model_flag: "--model"

capabilities: [code, api-design, testing, refactoring]

models:
  - id: codex-default
    context_window: 128000

protocol: stdio

auth:
  type: none
roles: [worker, ui, test]
modes: [supervised, auto, headless]

reporting:
  heartbeat_interval: 30

chat_designer:
  prompt_flag: "-p"
  stdin: false
  output_format: "stdout"
  timeout_seconds: 180

# Role sessions carry no prompt, so codex starts in its interactive mode.
role_command:
  args: []
  auto_args: ["--dangerously-bypass-approvals-and-sandbox"]

task_command:
  args: ["-C", "{workspace}", "{prompt}"]
  auto_args: ["--full-auto"]

review_only: true
owns: []
