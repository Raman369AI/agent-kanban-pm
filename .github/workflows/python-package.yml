name: Python package

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install package (editable, with dev extras)
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e ".[dev]"

    - name: Lint with flake8
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Test with pytest
      run: pytest -v --timeout=60 --timeout-method=thread

  build-and-smoke:
    name: Build wheel + smoke test
    needs: test
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install build tooling
      run: |
        python -m pip install --upgrade pip
        python -m pip install build twine

    - name: Build sdist and wheel
      run: python -m build

    - name: Check distribution metadata
      run: twine check dist/*

    - name: Install built wheel in clean venv
      run: |
        python -m venv /tmp/wheel-venv
        /tmp/wheel-venv/bin/pip install --upgrade pip
        /tmp/wheel-venv/bin/pip install dist/*.whl

    - name: Smoke test - kanban --help
      run: /tmp/wheel-venv/bin/kanban --help

    - name: Smoke test - server boots and serves UI
      env:
        DATABASE_URL: sqlite+aiosqlite:////tmp/kanban-smoke.db
      run: |
        /tmp/wheel-venv/bin/python - <<'PY'
        from fastapi.testclient import TestClient
        from main import app

        with TestClient(app) as client:
            for path, expected in (("/", 200), ("/static/css/style.css", 200), ("/docs", 200)):
                r = client.get(path)
                assert r.status_code == expected, f"{path}: {r.status_code}\n{r.text[:500]}"
        print("server boot smoke OK")
        PY
      working-directory: /tmp
