name: opencode
display_name: "OpenCode"
version: "1.1"

# Flags verified against `opencode --help` / `opencode run --help` (v1.18.22).
invoke:
  command: opencode
  info_flag: "--version"
  model_flag: "--model"

capabilities: [code, debugging, fullstack, testing]

models:
  - id: opencode-default
    context_window: 128000

protocol: stdio

auth:
  type: none
roles: [worker, test]
modes: [supervised, auto, headless]

reporting:
  heartbeat_interval: 30

chat_designer:
  # `opencode run <message>` is the non-interactive form — a subcommand, not a
  # flag — so it is passed as an extra arg and the prompt is appended after it.
  prompt_flag: ""
  extra_args: ["run"]
  stdin: false
  output_format: "stdout"
  timeout_seconds: 300

task_command:
  # `run` takes the message positionally; --dir scopes it to the worktree.
  args: ["run", "--dir", "{workspace}", "{prompt}"]
  auto_args: ["--auto"]

owns: []
review_only: false
